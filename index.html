<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch The Box 🎯</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111827;
      color: white;
    }

    h1 {
      margin-top: 25px;
    }

    #info {
      font-size: 20px;
      margin: 15px;
    }

    #game {
      width: 90%;
      max-width: 600px;
      height: 400px;
      margin: auto;
      position: relative;
      overflow: hidden;
      background: white;
      border-radius: 15px;
      border: 4px solid #374151;
    }

    #target {
      position: absolute;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 15px;
      background: #ef4444;
      font-size: 28px;
      cursor: pointer;
      display: none;
    }

    button {
      padding: 12px 22px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #start {
      background: #22c55e;
      color: white;
    }

    #restart {
      background: #3b82f6;
      color: white;
    }

    #message {
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎯 Catch The Box</h1>

  <div id="info">
    Score: <span id="score">0</span>
    &nbsp; | &nbsp;
    Time: <span id="time">10</span>
  </div>

  <button id="start">▶ Start Game</button>
  <button id="restart">🔄 Restart</button>

  <p id="message">लाल 🎯 बॉक्स को जल्दी-जल्दी क्लिक करो!</p>

  <div id="game">
    <button id="target">🎯</button>
  </div>

  <script>

    let score = 0;
    let time = 10;
    let gameRunning = false;
    let timer;

    const game = document.getElementById("game");
    const target = document.getElementById("target");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");

    function moveTarget() {

      const maxX = game.clientWidth - target.offsetWidth;
      const maxY = game.clientHeight - target.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function startGame() {

      clearInterval(timer);

      score = 0;
      time = 10;
      gameRunning = true;

      scoreText.textContent = score;
      timeText.textContent = time;

      target.style.display = "block";

      message.textContent = "🔥 जल्दी क्लिक करो!";

      moveTarget();

      timer = setInterval(function () {

        time--;

        timeText.textContent = time;

        if (time <= 0) {

          clearInterval(timer);

          gameRunning = false;

          target.style.display = "none";

          message.textContent =
            "🎉 Game Over! आपका Score: " + score;

        }

      }, 1000);
    }

    target.addEventListener("click", function () {

      if (!gameRunning) return;

      score++;

      scoreText.textContent = score;

      moveTarget();

    });

    document.getElementById("start")
      .addEventListener("click", startGame);

    document.getElementById("restart")
      .addEventListener("click", startGame);

  </script>

</body>
</html>
